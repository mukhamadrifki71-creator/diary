<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diary Harian Saya</title>
  <!-- Google Fonts & FontAwesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --primary-color: #6366f1;
      --primary-hover: #4f46e5;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      --card-bg: rgba(255, 255, 255, 0.95);
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      --success-color: #10b981;
      --error-color: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      padding: 40px 20px;
      position: relative;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
    }

    /* Container Notifikasi Toast */
    #toastContainer {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .toast {
      min-width: 280px;
      padding: 14px 20px;
      border-radius: 12px;
      background: white;
      color: #0f172a;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      animation: slideIn 0.3s ease forwards;
    }

    .toast.success {
      border-left: 5px solid var(--success-color);
    }
    .toast.success i { color: var(--success-color); }

    .toast.error {
      border-left: 5px solid var(--error-color);
    }
    .toast.error i { color: var(--error-color); }

    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    @keyframes fadeOut {
      from { transform: translateX(0); opacity: 1; }
      to { transform: translateX(100%); opacity: 0; }
    }

    /* Header */
    header {
      text-align: center;
      color: white;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .current-date-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      padding: 8px 18px;
      border-radius: 50px;
      font-size: 0.9rem;
      font-weight: 500;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    /* Card Styling */
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
      backdrop-filter: blur(10px);
    }

    .card h2 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Form Controls */
    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #334155;
    }

    input[type="text"], input[type="datetime-local"], textarea, select {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.95rem;
      background: #f8fafc;
      transition: all 0.2s ease;
      color: var(--text-main);
    }

    input[type="text"]:focus, input[type="datetime-local"]:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--primary-color);
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
    }

    textarea {
      height: 110px;
      resize: vertical;
    }

    button {
      width: 100%;
      background: var(--primary-color);
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    button:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    /* Filter & Search Box */
    .filter-box {
      display: flex;
      gap: 12px;
    }

    .filter-box input { flex: 2; }
    .filter-box select { flex: 1; }

    /* List Diary Cards */
    .diary-item {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      border: 1px solid var(--border-color);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .diary-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
    }

    .diary-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
      gap: 12px;
    }

    .diary-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #0f172a;
    }

    .diary-date {
      font-size: 0.8rem;
      background: #e0e7ff;
      color: #3730a3;
      padding: 4px 10px;
      border-radius: 20px;
      white-space: nowrap;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .diary-content {
      color: #334155;
      line-height: 1.6;
      font-size: 0.95rem;
      white-space: pre-line;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: white;
      opacity: 0.8;
    }

    .empty-state i {
      font-size: 2.5rem;
      margin-bottom: 12px;
    }

    /* Responsive Design */
    @media (max-width: 576px) {
      body { padding: 20px 12px; }
      .filter-box { flex-direction: column; gap: 0; }
      .filter-box input, .filter-box select { margin-bottom: 12px; }
      .diary-header { flex-direction: column; gap: 6px; }
      #toastContainer { left: 20px; right: 20px; }
    }
  </style>
</head>
<body>

  <!-- Container Notifikasi Pop-up -->
  <div id="toastContainer"></div>

  <div class="container">
    <!-- Header Utama -->
    <header>
      <h1><i class="fa-solid fa-book-bookmark"></i> Diary Harian</h1>
      <div class="current-date-badge">
        <i class="fa-regular fa-calendar-days"></i>
        <span id="liveClock">Memuat tanggal...</span>
      </div>
    </header>

    <!-- Form Tambah Catatan -->
    <div class="card">
      <h2><i class="fa-solid fa-pen-to-square" style="color: var(--primary-color);"></i> Tulis Catatan Baru</h2>
      <form id="diaryForm">
        <div class="form-group">
          <label for="title">Judul Catatan</label>
          <input type="text" id="title" placeholder="Contoh: Liburan ke pantai..." required>
        </div>

        <div class="form-group">
          <label for="entryDate">Tanggal & Waktu Catatan</label>
          <input type="datetime-local" id="entryDate" required>
        </div>

        <div class="form-group">
          <label for="content">Isi Diary</label>
          <textarea id="content" placeholder="Ceritakan detail momen atau pikiranmu hari ini..." required></textarea>
        </div>

        <button type="submit" id="submitBtn">
          <i class="fa-solid fa-paper-plane"></i> Simpan ke Diary
        </button>
      </form>
    </div>

    <!-- Filter & Pencarian -->
    <div class="card" style="padding: 16px;">
      <div class="filter-box">
        <input type="text" id="searchInput" placeholder="🔍 Cari berdasarkan judul atau isi...">
        <select id="sortOrder">
          <option value="desc">📅 Tanggal Terbaru</option>
          <option value="asc">📅 Tanggal Terlama</option>
        </select>
      </div>
    </div>

    <!-- List Catatan -->
    <div id="diaryList">Memuat catatan...</div>
  </div>

  <script>
    // KREDENSIAL SUPABASE
    const SUPABASE_URL = 'https://pfigoreihbgeqigfgsv.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBmaWdvcmVpaHhiZ2VxaWdmZ3N2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwODUzODgsImV4cCI6MjEwNTY2MTM4OH0.jPbcbihPPiAtlCmLihHkHWEETWQOeRNEryRwikH2OlQ';

    // Penggunaan nama variabel 'supabaseClient' untuk menghindari bentrok deklarasi
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const diaryForm = document.getElementById('diaryForm');
    const diaryList = document.getElementById('diaryList');
    const submitBtn = document.getElementById('submitBtn');
    const searchInput = document.getElementById('searchInput');
    const sortOrder = document.getElementById('sortOrder');
    const entryDateInput = document.getElementById('entryDate');
    const toastContainer = document.getElementById('toastContainer');

    let searchTimeout = null;

    // 1. Fungsi Tampilkan Notifikasi Toast
    function showToast(message, type = 'success') {
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      
      const iconClass = type === 'success' ? 'fa-circle-check' : 'fa-circle-xmark';
      toast.innerHTML = `
        <i class="fa-solid ${iconClass}"></i>
        <span>${escapeHtml(message)}</span>
      `;

      toastContainer.appendChild(toast);

      setTimeout(() => {
        toast.style.animation = 'fadeOut 0.3s ease forwards';
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    // 2. Set Default Input Tanggal ke Waktu Sekarang
    function setDefaultDate() {
      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      entryDateInput.value = now.toISOString().slice(0, 16);
    }
    setDefaultDate();

    // 3. Tampilkan Tanggal Hari Ini di Header
    function updateLiveClock() {
      const now = new Date();
      const options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
      document.getElementById('liveClock').textContent = now.toLocaleDateString('id-ID', options);
    }
    updateLiveClock();

    // 4. Format Tanggal Tampilan Catatan
    function formatDate(dateString) {
      const date = new Date(dateString);
      return date.toLocaleDateString('id-ID', {
        day: 'numeric',
        month: 'short',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    // 5. Ambil Data Catatan dari Supabase
    async function fetchDiaries() {
      const keyword = searchInput.value.trim();
      const isAscending = sortOrder.value === 'asc';

      let query = supabaseClient
        .from('diaries')
        .select('*')
        .order('created_at', { ascending: isAscending });

      if (keyword !== '') {
        query = query.or(`title.ilike.%${keyword}%,content.ilike.%${keyword}%`);
      }

      const { data, error } = await query;

      if (error) {
        diaryList.innerHTML = `<div class="empty-state"><i class="fa-solid fa-triangle-exclamation"></i><p>Gagal memuat catatan: ${error.message}</p></div>`;
        return;
      }

      if (!data || data.length === 0) {
        diaryList.innerHTML = `
          <div class="empty-state">
            <i class="fa-regular fa-folder-open"></i>
            <p>Belum ada catatan diary yang ditemukan.</p>
          </div>`;
        return;
      }

      diaryList.innerHTML = data.map(item => `
        <div class="diary-item">
          <div class="diary-header">
            <h3 class="diary-title">${escapeHtml(item.title)}</h3>
            <span class="diary-date">
              <i class="fa-regular fa-clock"></i> ${formatDate(item.created_at)}
            </span>
          </div>
          <p class="diary-content">${escapeHtml(item.content)}</p>
        </div>
      `).join('');
    }

    // 6. Listener Pencarian (Debounce 300ms)
    searchInput.addEventListener('input', () => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(fetchDiaries, 300);
    });

    // 7. Listener Filter Urutan
    sortOrder.addEventListener('change', fetchDiaries);

    // 8. Simpan Catatan Baru
    diaryForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan...';

      const title = document.getElementById('title').value;
      const content = document.getElementById('content').value;
      const selectedDate = new Date(entryDateInput.value).toISOString();

      const { error } = await supabaseClient
        .from('diaries')
        .insert([{ 
          title: title, 
          content: content, 
          created_at: selectedDate 
        }]);

      if (error) {
        showToast('Gagal menyimpan: ' + error.message, 'error');
      } else {
        showToast('Catatan diary berhasil disimpan!', 'success');
        diaryForm.reset();
        setDefaultDate();
        await fetchDiaries();
      }

      submitBtn.disabled = false;
      submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Simpan ke Diary';
    });

    // Helper XSS Prevention
    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Load data awal
    fetchDiaries();
  </script>
</body>
</html>
